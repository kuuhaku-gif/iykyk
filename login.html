<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - CineMax</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

  <header class="auth-header">
    <a href="Trangchu.html" class="logo">Cikipdy<span>Max</span></a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h2>Đăng Nhập</h2>
      <form class="auth-form" action="#" method="POST">
        
        <div class="form-group">
          <label for="email">Email hoặc Số điện thoại</label>
          <input type="text" id="email" name="email" placeholder="Nhập email hoặc số điện thoại" required>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" name="remember"> Ghi nhớ đăng nhập
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-primary btn-full">Đăng Nhập</button>
      </form>

      <div class="auth-footer">
        <p>Bạn chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
        <p><a href="Trangchu.html" class="back-home">← Quay lại trang chủ</a></p>
      </div>
    </div>
  </main>

</body>
</html>
